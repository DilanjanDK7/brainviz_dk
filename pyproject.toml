[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brainviz_dk"
version = "0.1.0"
description = "Lightweight 3D brain plotting utilities without MNE"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Dilanjan DK", email = "ddiyabal@uwo.ca"}
]
keywords = [
    "neuroimaging",
    "brain",
    "visualization",
    "nifti",
    "mri",
    "fmri",
    "surface",
    "plotting",
    "nilearn",
    "fsaverage",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.19.0",
    "nibabel>=3.0.0",
    "nilearn>=0.9.0",
    "matplotlib>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
]
templates = [
    "templateflow>=0.8.0",
]
interactive = [
    "plotly>=5.0.0",
]
imaging = [
    "Pillow>=8.0.0",
]
all = [
    "templateflow>=0.8.0",
    "plotly>=5.0.0",
    "Pillow>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/dilanjan/brainviz_dk"
Documentation = "https://brainviz-dk.readthedocs.io"
Repository = "https://github.com/dilanjan/brainviz_dk"
Issues = "https://github.com/dilanjan/brainviz_dk/issues"
Changelog = "https://github.com/dilanjan/brainviz_dk/blob/main/CHANGELOG.md"

[project.scripts]
brainviz_dk = "brainviz_dk.__main__:main"